[project]
name = "image-similarity"
version = "0.1.0"
description = "CLI for image-library similarity search using EmbeddingGemma 2 embeddings"
readme = "README.md"
authors = [
    { name = "xucroyuri", email = "xucriyuri@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
]

[project.scripts]
image-similarity = "image_similarity:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
local = [
    "sentence-transformers>=6.1",
    "torch>=2.5.0",
    "torchvision>=0.29.2",
]
